<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Greka Arquitectos se mudó a grekaarquitectos.com</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://grekaarquitectos.com/">
  <meta http-equiv="refresh" content="0; url=https://grekaarquitectos.com/">
  <script>
    // Links viejos con HashRouter (#/project/x) van a la misma página en el dominio nuevo
    var h = location.hash;
    location.replace("https://grekaarquitectos.com" + (h.indexOf("#/") === 0 ? h.slice(1) : "/" + h));
  </script>
</head>
<body>
  <p>Nos mudamos a <a href="https://grekaarquitectos.com/">grekaarquitectos.com</a>.</p>
</body>
</html>
